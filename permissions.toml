# LuckPerms groups, applied on deploy (see docs). Each entry is passed to
# `lp group <name> permission set`, so contexts work: "worldedit.* server=fpv".
# A listed group is replaced as a whole; groups not listed here are left alone.
# Nobody is op: staff powers come from these groups.

[groups.default]
permissions = [
    "essentials.spawn",
    "essentials.home",
    "essentials.sethome",
    "essentials.help",
    "flan.claim.create false server=fpv",
    "essentialcommands.warp.tp server=fpv",
    # /spawn on fpv: the lobby.
    "essentialcommands.spawn.tp server=fpv",
    # /tpa, /tpahere, /tpaccept, /tpdeny across servers (mods/crossserver, on the proxy; it replaces
    # each server's own).
    "propwash.tpa",
    # Chat (Carbon, on the proxy): global and local channels, whispers, ignoring, clickable links.
    "carbon.channel",
    "carbon.channel.global",
    "carbon.channel.global.see",
    "carbon.channel.global.speak",
    "carbon.channel.local",
    "carbon.channel.local.see",
    "carbon.channel.local.speak",
    "carbon.whisper",
    "carbon.whisper.message",
    "carbon.whisper.send",
    "carbon.whisper.receive",
    "carbon.whisper.reply",
    "carbon.whisper.continue",
    "carbon.ignore",
    "carbon.ignore.unignore",
    "carbon.chatlinks",
    # Plots: two 120x120 plots.
    "fabricplots.limit.2 server=plots",
    # /clear on plots and fpv, only their own inventory (Vanilla Permissions checks who a command hits,
    # so naming another player is refused too).
    "minecraft.command.clear server=plots",
    "minecraft.selector server=plots",
    "minecraft.selector.player.clear.* false server=plots",
    "minecraft.selector.entity.clear.* false server=plots",
    "minecraft.command.clear server=fpv",
    "minecraft.selector server=fpv",
    "minecraft.selector.player.clear.* false server=fpv",
    "minecraft.selector.entity.clear.* false server=fpv",
    # Plots build tools (DraftSmith, inside FabricPlots): only edit plots the player can build on,
    # at most 65,536 blocks per edit. Not draftsmith.admin, which edits outside plots.
    "draftsmith.use server=plots",
    "draftsmith.wand server=plots",
    "draftsmith.edit server=plots",
    "draftsmith.shapes server=plots",
    "draftsmith.brush server=plots",
    "draftsmith.measure server=plots",
    # WorldEdit on plots (mods/plotedit keeps it to plots they may build on, with block limits). Not:
    # //regen, //generate, schematics (files on the server), brushes, //butcher, snapshots, biomes.
    "worldedit.help server=plots",
    "worldedit.selection.pos server=plots",
    "worldedit.selection.hpos server=plots",
    "worldedit.selection.chunk server=plots",
    "worldedit.selection.expand server=plots",
    "worldedit.selection.contract server=plots",
    "worldedit.selection.shift server=plots",
    "worldedit.selection.outset server=plots",
    "worldedit.selection.inset server=plots",
    "worldedit.selection.size server=plots",
    "worldedit.selection.trim server=plots",
    "worldedit.wand server=plots",
    "worldedit.wand.toggle server=plots",
    "worldedit.analysis.count server=plots",
    "worldedit.analysis.distr server=plots",
    "worldedit.region.set server=plots",
    "worldedit.region.replace server=plots",
    "worldedit.region.overlay server=plots",
    "worldedit.region.center server=plots",
    "worldedit.region.walls server=plots",
    "worldedit.region.faces server=plots",
    "worldedit.region.hollow server=plots",
    "worldedit.region.line server=plots",
    "worldedit.region.curve server=plots",
    "worldedit.region.move server=plots",
    "worldedit.region.stack server=plots",
    "worldedit.region.smooth server=plots",
    "worldedit.region.naturalize server=plots",
    "worldedit.clipboard.copy server=plots",
    "worldedit.clipboard.cut server=plots",
    "worldedit.clipboard.paste server=plots",
    "worldedit.clipboard.rotate server=plots",
    "worldedit.clipboard.flip server=plots",
    "worldedit.clipboard.clear server=plots",
    "worldedit.history.undo server=plots",
    "worldedit.history.undo.self server=plots",
    "worldedit.history.redo server=plots",
    "worldedit.history.redo.self server=plots",
    "worldedit.history.clear server=plots",
    "worldedit.generation.sphere server=plots",
    "worldedit.generation.cylinder server=plots",
    "worldedit.generation.pyramid server=plots",
    "worldedit.generation.cone server=plots",
    "worldedit.fill server=plots",
    "worldedit.drain server=plots",
    "worldedit.fixwater server=plots",
    "worldedit.fixlava server=plots",
    "worldedit.removeabove server=plots",
    "worldedit.removebelow server=plots",
    "worldedit.replacenear server=plots",
    "worldedit.snow server=plots",
    "worldedit.thaw server=plots",
]

# Builders come in two ranks with the same [Builder] tag; senior-builder includes junior-builder.
[groups.junior-builder]
permissions = [
    # Role shown in the tab list; the highest weight wins and sorts first.
    "weight.90",
    '"prefix.90.<builder>[Builder]</builder> "',
    # /fly on the hub (EssentialsX).
    "essentials.fly server=hub",
    # Plots: ten plots (the highest fabricplots.limit.<n> wins).
    "fabricplots.limit.10 server=plots",
]

[groups.senior-builder]
permissions = [
    "weight.100",
    '"prefix.100.<builder>[Builder]</builder> "',
    "group.junior-builder",
    # Map editing on fpv.
    "worldedit.* server=fpv",
    "flan.command.bypass.claim server=fpv",
    # Map spawns (<map>) and spots (<map>_<spot>) are warps.
    "essentialcommands.warp.set server=fpv",
    "essentialcommands.warp.delete server=fpv",
    # Map time: /time on a map changes only that map's clock.
    "minecraft.command.time server=fpv",
    # Getting into a map that has no warp yet: /execute in maps:<name> run tp @s X Y Z
    "minecraft.command.execute server=fpv",
    "minecraft.command.teleport server=fpv",
    "minecraft.command.tp server=fpv",
]

[groups.staff]
permissions = [
    "weight.200",
    '"prefix.200.<staff>[Staff]</staff> "',
    "group.senior-builder",
    "minecraft.command.gamemode",
    "minecraft.command.teleport",
    "minecraft.command.tp",
    "minecraft.command.give",
    "minecraft.command.time",
    "minecraft.command.weather",
    "minecraft.command.effect",
    "minecraft.command.kick",
    "minecraft.bypass.force-gamemode",
    "worldedit.*",
    "essentials.*",
    "libertybans.*",
    # Joining during /maintenance.
    "maintenance.bypass",
    # The staff part of /help (mods/staffhelp).
    "propwash.help.staff",
    # /announce: send one of the announcements now (mods/announcements).
    "propwash.announce",
    # /tp <player> and /invsee <player> on any server (mods/crossserver); /invsee needs the
    # server's own too (EssentialsX via essentials.*, InvView on fpv and plots).
    "propwash.tp",
    "propwash.invsee",
    "invview.command.root",
    "invview.command.inv",
    "invview.command.echest",
    # /spy: see private messages and other servers' local chat (Carbon, on every server).
    "carbon.spy",
    # Staff chat channel (/staff, /sc, or start a message with #) and chat moderation.
    "carbon.channel.staff",
    "carbon.channel.staff.see",
    "carbon.channel.staff.speak",
    "carbon.clearchat.clear",
    "carbon.clearchat.exempt",
    "carbon.ignore.exempt",
    # Seeing vanished players (/v, docs/admin.md#vanish): tab list, each server, /msg.
    "propwash.vanish.see",
    "tab.seevanished",
    "vanish.feature.view",
    "essentials.vanish.see",
    "carbon.whisper.vanished",
    # Plots: no practical limit (64 is the highest node), and the plot staff tools, which are op-only
    # by default (nobody is op): /plot admin to edit any plot, /plot setowner, /plot reload.
    "fabricplots.limit.64 server=plots",
    "fabricplots.admin server=plots",
    "fabricplots.setowner server=plots",
    "fabricplots.reload server=plots",
    # WorldEdit on plots without mods/plotedit's limits (staff have worldedit.* already).
    "propwash.plotedit.bypass server=plots",
]

[groups.admin]
permissions = [
    "weight.300",
    '"prefix.300.<admin>[Admin]</admin> "',
    "*",
    # Not from "*": the invisibility effect (and its particles) of EssentialsX's /vanish, and arriving
    # vanished on the hub or unannounced on the network, which mods/vanish sets per player only while
    # they are vanished.
    "essentials.vanish.effect false",
    "essentials.silentjoin.vanish false",
    "networkjoinmessages.silent false",
]
