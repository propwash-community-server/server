# LuckPerms groups, applied on deploy (see README). Each entry is passed to
# `lp group <name> permission set`, so contexts work: "worldedit.* server=fpv".
# A listed group is replaced as a whole; groups not listed here are left alone.
# Nobody is op: staff powers come from these groups.

[groups.default]
permissions = [
    "essentials.spawn",
    "essentials.home",
    "essentials.sethome",
    "essentials.tpa",
    "essentials.tpaccept",
    "essentials.tpdeny",
    "flan.claim.create false server=fpv",
    "essentialcommands.warp.tp server=fpv",
]

[groups.builder]
permissions = [
    "worldedit.* server=fpv",
    "flan.command.bypass.claim server=fpv",
    # Map spawns (<map>) and spots (<map>_<spot>) are warps.
    "essentialcommands.warp.set server=fpv",
    "essentialcommands.warp.delete server=fpv",
    # Getting into a map that has no warp yet: /execute in maps:<name> run tp @s X Y Z
    "minecraft.command.execute server=fpv",
    "minecraft.command.teleport server=fpv",
    "minecraft.command.tp server=fpv",
]

[groups.staff]
permissions = [
    "group.builder",
    "minecraft.command.gamemode",
    "minecraft.command.teleport",
    "minecraft.command.tp",
    "minecraft.command.give",
    "minecraft.command.time",
    "minecraft.command.weather",
    "minecraft.command.effect",
    "minecraft.command.kick",
    "minecraft.bypass.force-gamemode",
    "worldedit.*",
    "essentials.*",
    "libertybans.*",
]

[groups.admin]
permissions = ["*"]
