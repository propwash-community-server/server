# LuckPerms groups, applied on deploy (see docs). Each entry is passed to
# `lp group <name> permission set`, so contexts work: "worldedit.* server=fpv".
# A listed group is replaced as a whole; groups not listed here are left alone.
# Nobody is op: staff powers come from these groups.

[groups.default]
permissions = [
    "essentials.spawn",
    "essentials.home",
    "essentials.sethome",
    "essentials.tpa",
    "essentials.tpaccept",
    "essentials.tpdeny",
    "flan.claim.create false server=fpv",
    "essentialcommands.warp.tp server=fpv",
    # Chat (Carbon, on the proxy): global and local channels, whispers, ignoring, clickable links.
    "carbon.channel",
    "carbon.channel.global",
    "carbon.channel.global.see",
    "carbon.channel.global.speak",
    "carbon.channel.local",
    "carbon.channel.local.see",
    "carbon.channel.local.speak",
    "carbon.whisper",
    "carbon.whisper.message",
    "carbon.whisper.send",
    "carbon.whisper.receive",
    "carbon.whisper.reply",
    "carbon.whisper.continue",
    "carbon.ignore",
    "carbon.ignore.unignore",
    "carbon.chatlinks",
    # Plots: one 120x120 plot.
    "fabricplots.limit.1 server=plots",
]

[groups.builder]
permissions = [
    # Role shown in the tab list; the highest weight wins and sorts first.
    "weight.100",
    '"prefix.100.<green>[Builder]</green> "',
    "worldedit.* server=fpv",
    "flan.command.bypass.claim server=fpv",
    # Map spawns (<map>) and spots (<map>_<spot>) are warps.
    "essentialcommands.warp.set server=fpv",
    "essentialcommands.warp.delete server=fpv",
    # Map time: /time on a map changes only that map's clock.
    "minecraft.command.time server=fpv",
    # Getting into a map that has no warp yet: /execute in maps:<name> run tp @s X Y Z
    "minecraft.command.execute server=fpv",
    "minecraft.command.teleport server=fpv",
    "minecraft.command.tp server=fpv",
    # Plots: two plots (the highest fabricplots.limit.<n> wins).
    "fabricplots.limit.2 server=plots",
]

[groups.staff]
permissions = [
    "weight.200",
    '"prefix.200.<gold>[Staff]</gold> "',
    "group.builder",
    "minecraft.command.gamemode",
    "minecraft.command.teleport",
    "minecraft.command.tp",
    "minecraft.command.give",
    "minecraft.command.time",
    "minecraft.command.weather",
    "minecraft.command.effect",
    "minecraft.command.kick",
    "minecraft.bypass.force-gamemode",
    "worldedit.*",
    "essentials.*",
    "libertybans.*",
    # Staff chat channel (/staff, /sc, or start a message with #) and chat moderation.
    "carbon.channel.staff",
    "carbon.channel.staff.see",
    "carbon.channel.staff.speak",
    "carbon.clearchat.clear",
    "carbon.clearchat.exempt",
    "carbon.ignore.exempt",
    # Plots: no practical limit (64 is the highest node), and the plot staff tools, which are op-only
    # by default (nobody is op): /plot admin to edit any plot, /plot setowner, /plot reload.
    "fabricplots.limit.64 server=plots",
    "fabricplots.admin server=plots",
    "fabricplots.setowner server=plots",
    "fabricplots.reload server=plots",
]

[groups.admin]
permissions = ["weight.300", '"prefix.300.<red>[Admin]</red> "', "*"]
