name: propwash-local

services:
  vps:
    build: .
    container_name: propwash-local
    hostname: propwash-local
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    ports: ["25565:25565"]
    volumes: [mc-home:/home/mc]

  # Stand-in for the world bucket; anonymous read and write.
  store:
    image: rclone/rclone:1.69.1
    entrypoint: ["sh", "-c", "mkdir -p /data/worlds /data/backups && exec rclone serve s3 --addr :8080 --dir-cache-time 0s /data"]
    ports: ["8080:8080"]
    volumes: [store:/data]

  # Blank stand-ins for the maps in servers/*/maps/ and their warps (see seed.py).
  seed:
    image: ghcr.io/astral-sh/uv:0.12.10-python3.13-trixie-slim
    command: ["uv", "run", "--script", "/seed.py"]
    volumes:
      - ./seed.py:/seed.py:ro
      - ../servers:/servers:ro
      - store:/data
      - mc-home:/home/mc

volumes:
  mc-home:
  store:
