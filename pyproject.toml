[project]
name = "propwash-community-server"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.109",
    "pyinfra==3.10.0",
]

[project.scripts]
upload-world = "tools.upload_world:main"
e2e = "tools.e2e:main"
check = "tools.check:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tools"
module-root = ""
