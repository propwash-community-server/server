type = "velocity"
ram = "1G"
# Only downloaded if missing: to update, change both url and jar.
jar = "velocity.jar"
url = "https://fill-data.papermc.io/v1/objects/35a5596a5468a035d8a32c8de5ebb0dc6b8d8f0cc3ff5169d514aca762af8aa8/velocity-4.2.0-30.jar"
plugins = [
    "https://cdn.modrinth.com/data/axTqSWQA/versions/OiYxu4ab/advanced-portals-2.8.0-spigot.jar",
    # /hub and /lobby
    "https://cdn.modrinth.com/data/X4gKexGh/versions/b8uGXJMq/velocity-hub-1.10-SNAPSHOT.jar",
    "https://cdn.modrinth.com/data/Vebnzrzj/versions/tamnmXad/LuckPerms-Velocity-5.5.71.jar",
    # Network-wide bans, mutes and kicks; data in MariaDB (sql.yml written by the deploy).
    "https://cdn.modrinth.com/data/PgXAUxLZ/versions/TUuNKL02/LibertyBans_Release-1.2.0-M1.jar",
    # Network-wide TAB list: server (and map on fpv, from TAB-Bridge) and LuckPerms role per player.
    "https://cdn.modrinth.com/data/gG7VFbG0/versions/UDraViyI/TAB%20v6.2.0.jar",
    # Scoreboard teams for TAB, which sort the tab list.
    "https://github.com/NEZNAMY/VelocityScoreboardAPI/releases/download/2.1.1/VelocityScoreboardAPIv.2.1.1.jar",
    # Network-wide chat: global, local (per server) and staff channels, files/plugins/carbonchat/channels/.
    # Our build with carbon-vanish.patch, so /msg and its name suggestions leave out vanished players
    # (mods/vanish); see docs/admin.md#vanish.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/carbonchat-velocity-3.0.0-beta.39-vanish.1.jar",
    # Lets the proxy handle signed chat; also needed on every backend.
    "https://cdn.modrinth.com/data/7IbzD4Zm/versions/OxMy0xf6/SignedVelocity-Proxy-1.5.0.jar",
    # Joining and leaving the network, told to everyone, and arriving from another server, told to that
    # server (files/plugins/networkjoinmessages/config.yml); each server's own messages are hidden.
    "https://cdn.modrinth.com/data/JPkVT6IT/versions/1MJzJZCs/NetworkJoinMessages-3.6.2.jar",
    # Placeholders for chat formats: <luckperms_prefix>, <player_current_server>.
    "https://cdn.modrinth.com/data/HQyibRsN/versions/Kpbing8i/MiniPlaceholders-Velocity-3.2.0.jar",
    # /maintenance on|off: kicks everyone but staff (maintenance.bypass) and keeps them out until off.
    "https://cdn.modrinth.com/data/VCAqN1ln/versions/qRSrfs7M/Maintenance-Velocity-5.1.0.jar",
    # Network-wide /v: our mods/vanish, built and uploaded by hand; see docs/admin.md#vanish.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/vanish-1.2.0.jar",
    # The supporter and staff parts of /help (files/plugins/staffhelp/supporter.txt, help.txt): our mods/staffhelp, built and
    # uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/staffhelp-1.1.0.jar",
    # Announcements every 15 minutes in chat on hub, fpv and plots
    # (files/plugins/announcements/announcements.toml): our mods/announcements, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/announcements-1.0.0.jar",
    # /tpa, /tpahere, /tpaccept, /tpdeny, staff /tp and /invsee across servers: our mods/crossserver,
    # built and uploaded by hand; see docs/admin.md#teleporting-and-invsee.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/crossserver-1.2.0.jar",
]
# MiniPlaceholders expansions, loaded from plugins/miniplaceholders/expansions/.
expansions = [
    "https://github.com/MiniPlaceholders/LuckPerms-Expansion/releases/download/2.1.0/LuckPerms-Expansion-2.1.0.jar",
    "https://github.com/MiniPlaceholders/Player-Expansion/releases/download/2.0.0/Player-Expansion-2.0.0.jar",
]
# Where players land, in order.
try = ["hub", "fpv"]
# Server list MOTD, in MiniMessage with palette.toml tags.
motd = "<brand>Propwash FPV Community Server"
# Added to the end of every server's /help.
help = """
<muted>On every server:</muted>
<accent>/hub</accent>: back to the hub
<accent>/g</accent>, <accent>/l</accent>: chat with everyone, or only this server (<accent>/g <message></accent> sends one message)
<accent>/msg <player> <message></accent>, <accent>/r <message></accent>: private messages
<accent>/ignore <player></accent>: hide a player's messages
<accent>/vote yes</accent>, <accent>/vote no</accent>: answer a vote (or click it)
"""

# /maintenance starttimer <minutes> turns maintenance on later, announcing it at the plugin's default
# times (timer-broadcast-for-seconds); before a deploy, it reads as a restart, which is what players see.
[config."plugins/maintenance/language-en.yml"]
starttimerBroadcast = '"<gray>Server restarting in <gold>%TIME%<gray>."'
