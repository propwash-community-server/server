type = "velocity"
ram = "1G"
# Only downloaded if missing: to update, change both url and jar.
jar = "velocity.jar"
url = "https://fill-data.papermc.io/v1/objects/35a5596a5468a035d8a32c8de5ebb0dc6b8d8f0cc3ff5169d514aca762af8aa8/velocity-4.2.0-30.jar"
plugins = [
    "https://cdn.modrinth.com/data/axTqSWQA/versions/OiYxu4ab/advanced-portals-2.8.0-spigot.jar",
    # /hub and /lobby
    "https://cdn.modrinth.com/data/X4gKexGh/versions/b8uGXJMq/velocity-hub-1.10-SNAPSHOT.jar",
    "https://cdn.modrinth.com/data/Vebnzrzj/versions/tamnmXad/LuckPerms-Velocity-5.5.71.jar",
    # Network-wide bans, mutes and kicks; data in MariaDB (sql.yml written by the deploy).
    "https://cdn.modrinth.com/data/PgXAUxLZ/versions/TUuNKL02/LibertyBans_Release-1.2.0-M1.jar",
    # Network-wide TAB list: server and LuckPerms role per player.
    "https://cdn.modrinth.com/data/Q10irTG0/versions/7gyD0ard/Velocitab-1.7.11-b34b3ec.jar",
    # Network-wide chat: global, local (per server) and staff channels, files/plugins/carbonchat/channels/.
    "https://cdn.modrinth.com/data/QzooIsZI/versions/A8tY8WPX/carbonchat-velocity-3.0.0-beta.39.jar",
    # Lets the proxy handle signed chat; also needed on every backend.
    "https://cdn.modrinth.com/data/7IbzD4Zm/versions/OxMy0xf6/SignedVelocity-Proxy-1.5.0.jar",
    # Placeholders for chat formats: <luckperms_prefix>, <player_current_server>.
    "https://cdn.modrinth.com/data/HQyibRsN/versions/Kpbing8i/MiniPlaceholders-Velocity-3.2.0.jar",
]
# MiniPlaceholders expansions, loaded from plugins/miniplaceholders/expansions/.
expansions = [
    "https://github.com/MiniPlaceholders/LuckPerms-Expansion/releases/download/2.1.0/LuckPerms-Expansion-2.1.0.jar",
    "https://github.com/MiniPlaceholders/Player-Expansion/releases/download/2.0.0/Player-Expansion-2.0.0.jar",
]
# Where players land, in order.
try = ["hub", "fpv"]
# Server list MOTD, in MiniMessage with palette.toml tags.
motd = "<brand>Propwash FPV Community Server"
# Added to the end of every server's /help.
help = """
<muted>On every server:</muted>
<accent>/hub</accent>: back to the hub
<accent>/g</accent>, <accent>/l</accent>: chat with everyone, or only this server (<accent>/g <message></accent> sends one message)
<accent>/msg <player> <message></accent>, <accent>/r <message></accent>: private messages
<accent>/ignore <player></accent>: hide a player's messages
"""
