# Each player's entry in the tab list: [server] or, on a freestyle or race map, [race: map] (see tab.yml.j2), then
# the LuckPerms role; [V] after vanished players, which only staff see; [AFK] after staff in /afk (mods/crossserver).
_DEFAULT_:
  tabprefix: "<muted>[%server%%condition:map%]</muted> %luckperms-prefix%"
  customtabname: "%player%"
  tabsuffix: "%condition:vanished%%propwash-afk%"
  tagprefix: ""
  tagsuffix: ""
