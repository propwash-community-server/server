# /help, in MiniMessage with palette.toml tags.
help = """
<brand><bold>Plots</bold></brand>: a creative world where every player gets a 120x120 plot to build on.
<accent>/plot auto</accent>: get a free plot
<accent>/plot claim</accent>: claim the empty plot you stand on
<accent>/plot menu</accent>: your plots and their settings
<accent>/plot trust <player></accent>: let someone build on your plot
<accent>/draft</accent>: build tools (fill, copy and paste, shapes, brushes, undo)
<accent>/draft wand</accent>: select two corners for the build tools
Only you and players you trust can build on your plot.
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<brand><bold>Plots</bold></brand>: <accent>/plot auto</accent> to get a plot, <accent>/help</accent> for more.
"""

# 120x120 plots, so /plot auto gives a big plot and players don't need to merge. plot-size is read
# at startup and the grid is generated with it: changing it needs a fresh plots world.
# Spawn is the middle of the road crossing at the corner of the four spawn plots around (0,0),
# standing on the spawn build (y 69). Keep the plots_spawn datapack at the same spot.
[config."config/fabricplots.properties"]
plot-size = "120"
spawn-x = "-9"
spawn-y = "69"
spawn-z = "-9"
# The street sweeper rebuilds roads (removing anything built on them) except this far from spawn,
# so staff (in /plot admin) can build on the spawn area's roads: 145 blocks each way.
street-sweeper-spawn-radius = "145"
allow-player-combine = "false"
# No portal system: the plot world is the whole server, so no calcite exit portals on the roads,
# no Portal Key (compass) on claim, no /plot key. Existing portals are removed on start.
portals = "false"
# Its welcome points at portals and /plot world, which we don't have; the welcome key above replaces it.
welcome-message = "false"

# Vanish (/v): no fake "left the game" / "joined the game" when vanishing, like every other join message.
[config."config/vanish.hocon"]
send-join-disconnect-message = "false"

# Driftpark's resource pack (furniture models), as on fpv; see servers/fpv/maps/driftpark.toml.
[properties]
# Escaped the way the server writes it back, so deploys don't see a change and restart.
resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/driftpark-569ec8f1.zip'
resource-pack-sha1 = "569ec8f1ef00fdc925d3ba12b482c9c3c331c786"
require-resource-pack = "false"

# Only written when the server is first created. Nobody uses the overworld: players spawn in the
# plot world (files/world/datapacks/plots_spawn), where FabricPlots puts them in creative.
[new_world]
motd = "Propwash Plots"
level-type = "minecraft\\:flat"
generate-structures = "false"
