# /help, in MiniMessage with palette.toml tags.
help = """
<brand><bold>Plots</bold></brand>: a creative world where every player gets up to two 120x120 plots to build on.
<accent>/plot auto</accent>: get a free plot
<accent>/plot home</accent>, <accent>/plot home 2</accent>: go to your first or second plot
<accent>/plot sethome</accent>: on your plot, set where you and visitors arrive (and which way they face)
<accent>/plot claim</accent>: claim the empty plot you stand on
<accent>/plot menu</accent>: your plots and their settings
<accent>/plot trust <player></accent>: let someone build on your plot
<accent>/plot flag help</accent>: let visitors ride minecarts, use doors, chests and more
<accent>/plot list</accent>, <accent>/plot visit <player> [2]</accent>: everyone's plots, also when they're offline
<accent>/draft</accent>: build tools (fill, copy and paste, shapes, brushes, undo)
<accent>/draft wand</accent>: select two corners for the build tools
<accent>//wand</accent>, <accent>//set</accent>, <accent>//replace</accent>, <accent>//copy</accent>, <accent>//paste</accent>, <accent>//undo</accent>: WorldEdit on your plots, up to 45,000 blocks per command and per 30 seconds
<accent>/race</accent>, <accent>/race <course></accent>: the race courses on plots, and go to one's start
<accent>/mydrone</accent>: bring your drone to you
<accent>/dronetp</accent>: go to your drone
<accent>/clear</accent>: empty your inventory
<accent>/kit create <name></accent>, <accent>/kit <name></accent>, <accent>/kit edit <name></accent>: your own kits (also on freestyle and race)
<accent>/plot flag set drone-glass on</accent> (everyone's drones) or <accent>drone-glass-members on</accent> (yours and trusted players'), <accent>/plot glassregen <seconds></accent>: let drones smash the glass on your plot, back after 3 min or your time
<accent>/debugstick</accent>: change block states (facing, half, waterlogged...) on your plot
Only you and players you trust can build on your plot.
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<propwash><bold>Plots</bold></propwash><muted>: </muted><white>/plot auto</white><muted> to get a plot, </muted><white>/help</white><muted> for more.</muted>
"""

# Set on every start.
[gamerules]
# Respawns exactly at spawn, not scattered around it.
respawn_radius = 0
# No mobs, fire spread, explosions or Nether.
spawn_mobs = false
spawn_monsters = false
spawn_patrols = false
spawn_phantoms = false
spawn_wandering_traders = false
spawn_wardens = false
spawner_blocks_work = false
raids = false
mob_griefing = false
# Fast drones smash glass, only on plots with the drone-glass or drone-glass-members flag (mods/regen and FabricPlots decide).
"propwash:drones_break_blocks" = true
fire_spread_radius_around_player = 0
tnt_explodes = false
allow_entering_nether_using_portals = false
# No "has made the advancement" in chat.
show_advancement_messages = false

# 120x120 plots, so /plot auto gives a big plot and players don't need to merge. plot-size is read
# at startup and the grid is generated with it: changing it needs a fresh plots world.
# Spawn is on the Halloween spawn build (2026-10-20; before, the road crossing at -9 69 -9).
# Keep the plots_spawn datapack at the same spot.
# mods/plotedit: WorldEdit limits for players (staff with propwash.plotedit.bypass have none). Read
# again whenever the file changes, so a deploy changes them without a restart.
[config."config/plotedit.properties"]
max-blocks-per-command = "45000"
max-blocks-per-window = "45000"
window-seconds = "30"
# Region commands (//set, //copy...) refuse bigger selections: WorldEdit visits every position.
max-selection-volume = "1000000"
# With propwash.plotedit.staff (mods): higher limits, still only where they may build.
"staff.max-blocks-per-command" = "80000"
"staff.max-blocks-per-window" = "80000"
# The monitor (logs/plotedit.log on plots): ticks slower than lag-log-ms during players' WorldEdit are
# logged with whose edits ran in them; above lag-alert-ms staff are told in chat, and also when a player
# hits a limit limit-alert-count times in 10 minutes.
lag-log-ms = "250"
lag-alert-ms = "1000"
limit-alert-count = "5"

# WorldEdit itself: //sphere, //cyl, //fill and the like at most this radius, for everyone here.
# One WorldEdit command changes at most 1,000,000 blocks unless you raise it for yourself with
# //limit <blocks> (//limit -1: none, admins only); a huge //set loaded ~50,000 chunks and froze a
# server (docs/admin.md#frozen-server).
[config."config/worldedit/worldedit.properties"]
max-radius = "40"
default-max-changed-blocks = "1000000"

[config."config/fabricplots.properties"]
plot-size = "120"
spawn-x = "40"
spawn-y = "75"
spawn-z = "39"
# The street sweeper rebuilds roads (removing anything built on them) except this far from spawn,
# so staff (in /plot admin) can build on the spawn area's roads: 194 blocks each way from spawn,
# which still covers the area 145 around the old spawn (-9 -9).
street-sweeper-spawn-radius = "194"
allow-player-combine = "false"
# FabricPlots sets the plot world's advance_time and advance_weather game rules from these on every
# start (and /plot reload), so a /gamerule change didn't last: time and weather stay put.
advance-time = "false"
advance-weather = "false"
# Anyone may, anywhere in the plot world (other people's plots too): place drones (the item used on a
# block), use drone workbenches, and fly, hit and pick up drones. Our patch's free-* settings.
# One drone per player at a time: files/world/datapacks/propwash_drone_limit (the same as freestyle and race).
# Escaped the way FabricPlots writes them back, so deploys don't see a change and restart.
free-items = 'propwash\:drone'
free-blocks = 'propwash\:drone_workbench'
free-entities = 'propwash\:drone'
# Against minecart spam: at most 15 per plot, and 5 seconds between one player's placements.
minecart-cap = "15"
minecart-cooldown-seconds = "5"
# No portal system: the plot world is the whole server, so no calcite exit portals on the roads,
# no Portal Key (compass) on claim, no /plot key. Existing portals are removed on start.
portals = "false"
# Its welcome points at portals and /plot world, which we don't have; the welcome key above replaces it.
welcome-message = "false"

# Vanish (/v): no fake "left the game" / "joined the game" when vanishing, like every other join message.
[config."config/vanish.hocon"]
send-join-disconnect-message = "false"

# The maps' resource pack (Drift Arena furniture models), as on freestyle and race; see docs/maps.md#drift-arena-and-moto-arena.
[properties]
# Escaped the way the server writes it back, so deploys don't see a change and restart.
# The regular maps pack, with the backpack cosmetic's model (propwash_cosmetics:backpack, mods/backpack).
# Halloween 2026 used propwash-maps-halloween-855e1980.zip instead (docs/maps.md#halloween).
resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/propwash-maps-1aa06938.zip'
resource-pack-sha1 = "1aa06938f6bc5a5f1b52af2788fa8361aeedf275"
require-resource-pack = "false"

# Only written when the server is first created. Nobody uses the overworld: players spawn in the
# plot world (files/world/datapacks/plots_spawn, which also sends anyone found in the overworld
# there), where FabricPlots puts them in creative.
[new_world]
motd = "Propwash Plots"
level-type = "minecraft\\:flat"
generate-structures = "false"

# mods/kits: /kit cooldown (staff.cooldown: propwash.kits.staff), kits and items per kit
# (supporter.*: propwash.kits.supporter). Kits are
# in storage, the same folder on freestyle, race and plots, so they're shared. Read again when the file changes.
[config."config/kits.properties"]
cooldown = "20"
"staff.cooldown" = "2"
kits = "1"
items = "3"
"supporter.kits" = "3"
"supporter.items" = "18"
storage = "/home/mc/kits"

# mods/tweaks: blocks broken in /plot admin mode go to the proxy's staff watch (mods/staffwatch,
# docs/admin.md#staff-watch). Read on start.
[config."config/tweaks.properties"]
staffwatch-folder = "/home/mc/servers/velocity/plugins/staffwatch"

# Essential Commands' /enderchest would merge with mods/tweaks' (/enderchest, /ec, /echest for
# propwash.enderchest). Its other settings aren't managed here (it doesn't use LuckPerms on plots).
[config."config/EssentialCommands.properties"]
enable_enderchest = "false"

# Simple Voice Chat: its own UDP port, the server's port - 1000, only on 127.0.0.1 (it would take every address);
# players reach it through the proxy's voice port (docs/servers.md#voice-chat).
[config."config/voicechat/voicechat-server.properties"]
port = "24570"
bind_address = "127.0.0.1"
max_voice_distance = "150"

# mods/voicebody: enabled = "false" turns it off on this server (pilots in FPV then hear around their
# drone, as the voice chat mod does by itself). Read again when the file changes.
[config."config/voicebody.properties"]
enabled = "true"
