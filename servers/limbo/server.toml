# Limbo: where players go who can't join the Fabric servers (no Fabric, another game version, missing or
# wrong mods); mods/crossserver sends them here with the reason. Paper with ViaVersion, so any version
# gets in. Its world came from dev (docs/servers.md#limbo).
type = "paper"
port = 25573
ram = "768M"
jar = "paper-26.3-159.jar"
url = "https://fill-data.papermc.io/v1/objects/2224a0b2b6b096ff4c429ad926e97977213e4f633e90cb3a49b5eeb82f94bab0/paper-26.3-159.jar"
plugins = [
    "https://cdn.modrinth.com/data/P1OZGk5p/versions/Fkfcr89K/ViaVersion-5.12.2.jar",
    "https://cdn.modrinth.com/data/NpvuJQoq/versions/WFO37e8T/ViaBackwards-5.12.2.jar",
    "https://cdn.modrinth.com/data/1u6JkXh5/versions/J1eeOh6C/worldedit-bukkit-7.4.6-beta-02.jar",
    "https://cdn.modrinth.com/data/hXiIvTyT/versions/nY6VN1XH/EssentialsX-2.22.0.jar",
    "https://cdn.modrinth.com/data/sYpvDxGJ/versions/lc5JHiNJ/EssentialsXSpawn-2.22.0.jar",
    "https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar",
    # Chat is handled on the proxy (Carbon); this lets it take over signed chat.
    "https://cdn.modrinth.com/data/7IbzD4Zm/versions/oEqZsNvv/SignedVelocity-Paper-1.5.0.jar",
]

# /help, in MiniMessage with palette.toml tags (no links: EssentialsX shows plain text). 9 lines per page, network part included.
help = """
<brand><bold>Limbo</bold></brand>: to fly with us you need Minecraft 26.3 with Fabric and the Propwash mods.
Everything you need: <white>propwashfpv.com</white>. Help on Discord: <white>discord.propwashfpv.com</white>
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<bold><white>Welcome to </white><propwash>Propwash FPV</propwash><white>!</white></bold>
<muted>To fly with us you need Minecraft 26.3 with Fabric and the Propwash mods. Everything you need: <click:open_url:'https://propwashfpv.com/'><hover:show_text:'propwashfpv.com'><white><underlined>propwashfpv.com</underlined></white></hover></click>, help on <click:open_url:'https://discord.propwashfpv.com'><hover:show_text:'discord.propwashfpv.com'><white><underlined>Discord</underlined></white></hover></click>.</muted>
"""

# Players go to the spawn (set it in game with /setspawn) every time they arrive.
[config."plugins/Essentials/config.yml"]
spawn-on-join = "true"
delay-motd = "-1"
notify-no-new-mail = "false"
# Nested under newbies:, hence the indent. '' = no kit on first join (the default gives stone tools).
"  kit" = "''"
# No "joined the game" / "left the game" in chat ('' hides them; none would be vanilla's).
custom-join-message = "''"
custom-quit-message = "''"
broadcast-afk-message = "false"
allow-silent-join-quit = "true"

# Only written when the server is first created.
[new_world]
motd = "Propwash Limbo"
level-type = "minecraft\\:flat"
generator-settings = '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
generate-structures = "false"
difficulty = "peaceful"
gamemode = "adventure"
force-gamemode = "true"
spawn-protection = "0"
