# /help, in MiniMessage with palette.toml tags.
help = """
<brand><bold>Race</bold></brand>: race Propwash drones on tracks built by the community.
<accent>/race</accent> or <accent>/map</accent>: list the maps
<accent>/race <name></accent> or <accent>/map <name></accent>: go to a map
<accent>/rtp</accent> or <accent>/map rtp</accent>: a random race
<accent>/spawn</accent>: back to the lobby, where the mannequins take you to the maps
<accent>/warp list</accent>, <accent>/warp tp <name></accent>: spots on the maps
<accent>/mydrone</accent>: bring your drone on this map to you
<accent>/dronetp</accent>: go to your drone
<accent>/clear</accent>: empty your inventory
<accent>/kit create <name></accent>, <accent>/kit <name></accent>, <accent>/kit edit <name></accent>: your own kits (also on plots and freestyle)
Nobody can build here; builders edit maps after <accent>/flan bypass</accent>.
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<propwash><bold>Race</bold></propwash><muted>: </muted><white>/race</white><muted> to pick a map, </muted><white>/help</white><muted> for more.</muted>
"""

# Set on every start. Maps are for flying: no mobs (drones are placed, not spawned).
[gamerules]
# New players and respawns land exactly on spawn (the lobby's /spawn spot), not scattered up to 10 blocks around it.
respawn_radius = 0
spawn_mobs = false
spawn_monsters = false
spawn_patrols = false
spawn_phantoms = false
spawn_wandering_traders = false
spawn_wardens = false
spawner_blocks_work = false
# Vines don't grow: they had covered mosslorn's flying paths (restored from its original 2026-11-05).
spread_vines = false
# Fast drones smash glass and glass panes (Propwash's block tag propwash:drone_breakable); mods/regen
# puts them back and decides on which maps (config/regen.properties).
"propwash:drones_break_blocks" = true

# Set on every deploy: everyone in creative.
[properties]
gamemode = "creative"
force-gamemode = "true"
# No vanilla spawn protection: each worlds:* map has its own spawn, and the 16-block default stopped
# non-ops using levers/buttons there. Flan already stops building in every world.
spawn-protection = "0"
# Drift Arena and Moto Arena (on freestyle): their vehicles and Drift Arena's
# furniture are models from this pack (docs/maps.md#drift-arena-and-moto-arena), invisible without
# it. The same on every server (hub, freestyle, race, plots), offered on joining, not required (yet); the SHA-1 is the zip's.
# Escaped the way the server writes it back, so deploys don't see a change and restart.
# The regular maps pack, with the backpack cosmetic's model (propwash_cosmetics:backpack, mods/backpack).
# Halloween 2026 used propwash-maps-halloween-855e1980.zip instead (docs/maps.md#halloween).
resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/propwash-maps-1aa06938.zip'
resource-pack-sha1 = "1aa06938f6bc5a5f1b52af2788fa8361aeedf275"
require-resource-pack = "false"

# Warps (/warp set, /warp tp) go through LuckPerms, see permissions.toml.
[config."config/EssentialCommands.properties"]
use_permissions_api = "true"
# With datapacks/warp_messages, /map and /warp tp say "Teleported to <warp>." and nothing more.
print_teleport_coordinates = "false"
# Its /enderchest would merge with mods/tweaks' (/enderchest, /ec, /echest for propwash.enderchest).
enable_enderchest = "false"
# Its own /rtp (a random spot in the overworld) would clash with ours: /rtp is a random race here (mods/tweaks).
enable_rtp = "false"

# mods/tweaks: /map is /race here (every map is a race track), and /rtp (/map rtp, the rtp mannequin) takes
# you to the start of a random course from /race, so the deploy writes no Melius Commands /map or /rtp here.
[config."config/tweaks.properties"]
map = "race"
# The race tracks that were builder worlds are maps now (maps/<map>.toml, from the store).
# TODO before 0.6.0: re-evaluate Dive Bar, Getchasum, Go Go and Scratch Attack (Advanced for now).
# Island map: fall below this Y and you (and your drone) go back to its race start.
"below.maps.gilbert_pro" = "-75"

# The tab list's name for race tracks whose tab name differs from their /race title (see maps/<map>.toml).
[tab.names]
tripple_threat = "Triple Threat"
gilbert_fast = "Gilbert Flow"

# Propwash (config/propwash/server.json): no generated "field slalom"/canyon/forest courses in new chunks;
# they turned up as ownerless unnamed courses in /race.
[propwash]
worldCourses = false

# mods/worlds: /world create <name> copies this map into worlds:<name>.
[config."config/worlds.properties"]
template = "maps:superflat_default"

# mods/regen: blocks broken by drones come back after this many seconds. Per map: seconds.<map> =
# "120", or "off" for no breaking on that map. Read again when the file changes (no restart).
[config."config/regen.properties"]
seconds = "180"

# Vanish (/v): no fake "left the game" / "joined the game" when vanishing, like every other join message.
[config."config/vanish.hocon"]
send-join-disconnect-message = "false"

# Flan world rules: none of these, anywhere on this server (maps and /world create worlds included;
# mods/regen copies the overworld's rules to worlds not named here), unless in /flan bypass.
# Not in the list, so anyone can: open doors, trapdoors and fence gates, step on pressure plates,
# press buttons and flip levers.
[flan]
deny = [
    "break", "place", "open_container", "interact_block", "interact_sign", "anvil", "bed", "beacon",
    "noteblock", "redstone",
    "jukebox", "enderchest", "enchantment", "itemframe_rotate", "lectern_take", "endcrystal_place",
    "target_block", "projectiles", "trample", "bucket", "ender_pearl", "chorus_fruit",
    "animal_interact", "hurt_animal", "hurt_named", "armorstand", "break_non_living", "archeology",
    "wind_charge", "hurt_player",
]
# Drones can be used, hit and picked up; placing them is files/world/datapacks/propwash_flan.
ignoredEntities = ["propwash:drone"]
# Flan's claim inspection tool, a stick by default: a wooden hoe, so it doesn't clash with
# Drift Arena's furniture tool (a stick named "Drift Tool").
inspectionItem = "minecraft:wooden_hoe"

# mods/kits: /kit cooldown (staff.cooldown: propwash.kits.staff), kits and items per kit
# (supporter.*: propwash.kits.supporter). Kits are
# in storage, the same folder on freestyle, race and plots, so they're shared. Read again when the file changes.
[config."config/kits.properties"]
cooldown = "20"
"staff.cooldown" = "2"
kits = "1"
items = "3"
"supporter.kits" = "3"
"supporter.items" = "18"
storage = "/home/mc/kits"

# Simple Voice Chat: its own UDP port, the server's port - 1000, only on 127.0.0.1 (it would take every address);
# players reach it through the proxy's voice port (docs/servers.md#voice-chat).
[config."config/voicechat/voicechat-server.properties"]
port = "24575"
bind_address = "127.0.0.1"
max_voice_distance = "150"

# mods/voicebody: enabled = "false" turns it off on this server (pilots in FPV then hear around their
# drone, as the voice chat mod does by itself). Read again when the file changes.
[config."config/voicebody.properties"]
enabled = "true"

# One WorldEdit command changes at most 1,000,000 blocks unless you raise it for yourself with
# //limit <blocks> (//limit -1: none, admins only); a huge //set loaded ~50,000 chunks and froze a
# server (docs/admin.md#frozen-server).
[config."config/worldedit/worldedit.properties"]
default-max-changed-blocks = "1000000"
