# Set on every deploy. Everyone in creative, only ops can build: spawn protection over a
# 3000-block radius covers the whole map (it also blocks non-ops from chests, doors and
# buttons, and only works while the server has at least one op).
[properties]
gamemode = "creative"
force-gamemode = "true"
spawn-protection = "3000"
