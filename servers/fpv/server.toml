type = "fabric"
port = 25569
ram = "6G"
jar = "fabric-server.jar"
url = "https://meta.fabricmc.net/v2/versions/loader/26.3/0.19.5/1.1.2/server/jar"
mods = [
    "https://cdn.modrinth.com/data/P7dR8mSH/versions/v2j28coa/fabric-api-0.162.0%2B26.3.jar",
    "https://cdn.modrinth.com/data/8dI2tmqs/versions/CsEpiziv/FabricProxy-Lite-2.12.0.jar",
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/propwash-fabric-26.3-0.5.2.jar",
    # Propwash: Just more Parts (143 extra FPV parts and frames, by lardtom). Clients need it too:
    # Propwash compares a parts fingerprint, so keep it on every server that runs Propwash.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/justmoreparts-fabric-26.3-1.1.1.jar",
    "https://cdn.modrinth.com/data/lCC4AmlO/versions/YN9zoh6h/melius-commands-2.1.3%2B26.3.jar",
    "https://cdn.modrinth.com/data/1u6JkXh5/versions/E7sbeRFx/worldedit-mod-7.4.6-beta-02.jar",
    "https://cdn.modrinth.com/data/6VdDUivB/versions/KANmt7ie/essential_commands-0.42.0-mc26.3.jar",
    "https://cdn.modrinth.com/data/Vebnzrzj/versions/DzQPkkXY/LuckPerms-Fabric-5.5.85.jar",
    # Permission nodes for vanilla commands (minecraft.command.<name>), granted through LuckPerms.
    "https://cdn.modrinth.com/data/fdZkP5Bb/versions/bpq3ZDRl/vanilla-permissions-0.3.6%2B26.1.2.jar",
    "https://cdn.modrinth.com/data/Si383TIH/versions/dAcEMeRZ/flan-26.3-1.12.8.b-fabric.jar",
    # Chat is handled on the proxy (Carbon); this lets it take over signed chat.
    "https://cdn.modrinth.com/data/7IbzD4Zm/versions/MBoj4XJ8/SignedVelocity-Fabric-1.5.0.jar",
    # No "joined the game" / "left the game" / AFK messages in chat; our mods/quiet, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/quiet-1.2.0-26.3.jar",
    # Dropped items are deleted (except for propwash.exempt); vanishing and un-vanishing show at once;
    # /mydrone brings your own drone to you; your drones go when you leave; the debug stick works in the plot world (/debugstick).
    # Our mods/tweaks, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/tweaks-1.3.0-26.3.jar",
    # /vanish, switched on by mods/vanish on the proxy (/v); see docs/admin.md#vanish.
    "https://cdn.modrinth.com/data/UL4bJFDY/versions/KgeCcJWw/vanish-1.6.16%2B26.3.jar",
    # /view inv|echest <player> for staff, items can be moved; /invsee on the proxy opens it here.
    "https://cdn.modrinth.com/data/jrDKjZP7/versions/uySsk7v8/InvView-1.4.22-26.3%2B.jar",
    # Tells the proxy's tab list (TAB) which map each player is on.
    "https://cdn.modrinth.com/data/kG3hVbBX/versions/Jl1SwQoK/TAB-Bridge%20v6.2.3%20-%20Fabric.jar",
]

# /help, in MiniMessage with palette.toml tags.
help = """
<brand><bold>FPV</bold></brand>: fly Propwash drones on maps built by the community.
<accent>/map</accent>: list the maps
<accent>/map <name></accent>: go to a map
<accent>/warp list</accent>, <accent>/warp tp <name></accent>: spots on the maps
<accent>/mydrone</accent>: bring your drone on this map to you
Nobody can build here; builders edit maps after <accent>/flan bypass</accent>.
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<brand><bold>FPV</bold></brand>: <accent>/map</accent> to pick a map, <accent>/help</accent> for more.
"""

# Set on every start. Maps are for flying: no mobs (drones are placed, not spawned).
[gamerules]
spawn_mobs = false
spawn_monsters = false
spawn_patrols = false
spawn_phantoms = false
spawn_wandering_traders = false
spawn_wardens = false
spawner_blocks_work = false

# Set on every deploy: everyone in creative.
[properties]
gamemode = "creative"
force-gamemode = "true"
# Drift Arena and Moto Arena (maps/driftpark.toml, maps/motoarena.toml): their vehicles and Drift Arena's
# furniture are models from this pack (docs/maps.md#drift-arena-and-moto-arena), invisible without
# it. The same on every server (hub, plots), offered on joining, not required (yet); the SHA-1 is the zip's.
# Escaped the way the server writes it back, so deploys don't see a change and restart.
resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/propwash-maps-6557a509.zip'
resource-pack-sha1 = "6557a50938db41df0a9ce22c7df79e849ca4a16b"
require-resource-pack = "false"

# Warps (/warp set, /warp tp) go through LuckPerms, see permissions.toml.
[config."config/EssentialCommands.properties"]
use_permissions_api = "true"
# With datapacks/warp_messages, /map and /warp tp say "Teleported to <warp>." and nothing more.
print_teleport_coordinates = "false"

# Vanish (/v): no fake "left the game" / "joined the game" when vanishing, like every other join message.
[config."config/vanish.hocon"]
send-join-disconnect-message = "false"

# Flan world rules: none of these, anywhere on fpv (maps included), unless in /flan bypass.
# Not in the list, so anyone can: open doors, trapdoors and fence gates, step on pressure plates,
# press buttons and flip levers.
[flan]
deny = [
    "break", "place", "open_container", "interact_block", "interact_sign", "anvil", "bed", "beacon",
    "noteblock", "redstone",
    "jukebox", "enderchest", "enchantment", "itemframe_rotate", "lectern_take", "endcrystal_place",
    "target_block", "projectiles", "trample", "bucket", "ender_pearl", "chorus_fruit",
    "animal_interact", "hurt_animal", "hurt_named", "armorstand", "break_non_living", "archeology",
    "wind_charge", "hurt_player",
]
# Drones can be used, hit and picked up; placing them is files/world/datapacks/propwash_flan.
ignoredEntities = ["propwash:drone"]
# Flan's claim inspection tool, a stick by default: a wooden hoe, so it doesn't clash with
# Drift Arena's furniture tool (a stick named "Drift Tool").
inspectionItem = "minecraft:wooden_hoe"
