type = "fabric"
port = 25567
ram = "1536M"
jar = "fabric-server.jar"
url = "https://meta.fabricmc.net/v2/versions/loader/26.3/0.19.5/1.1.2/server/jar"
mods = [
    "https://cdn.modrinth.com/data/P7dR8mSH/versions/v2j28coa/fabric-api-0.162.0%2B26.3.jar",
    "https://cdn.modrinth.com/data/8dI2tmqs/versions/CsEpiziv/FabricProxy-Lite-2.12.0.jar",
    # Clients need Propwash and Just More Parts for the hub too: players without them can't join a
    # Fabric server with them, and go to limbo (mods/crossserver, docs/servers.md#limbo).
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/propwash-fabric-26.3-0.5.2.jar",
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/justmoreparts-fabric-26.3-1.1.1.jar",
    "https://cdn.modrinth.com/data/lCC4AmlO/versions/YN9zoh6h/melius-commands-2.1.3%2B26.3.jar",
    "https://cdn.modrinth.com/data/1u6JkXh5/versions/E7sbeRFx/worldedit-mod-7.4.6-beta-02.jar",
    # drone_net / waxed_drone_net as WorldEdit block names (the maps pack's drone nets); our mods/blockaliases, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/blockaliases-1.0.0-26.3.jar",
    "https://cdn.modrinth.com/data/6VdDUivB/versions/KANmt7ie/essential_commands-0.42.0-mc26.3.jar",
    "https://cdn.modrinth.com/data/Vebnzrzj/versions/DzQPkkXY/LuckPerms-Fabric-5.5.85.jar",
    # Permission nodes for vanilla commands (minecraft.command.<name>), granted through LuckPerms.
    "https://cdn.modrinth.com/data/fdZkP5Bb/versions/bpq3ZDRl/vanilla-permissions-0.3.6%2B26.1.2.jar",
    # Chat is handled on the proxy (Carbon); this lets it take over signed chat.
    "https://cdn.modrinth.com/data/7IbzD4Zm/versions/MBoj4XJ8/SignedVelocity-Fabric-1.5.0.jar",
    # No "joined the game" / "left the game" / AFK messages in chat; our mods/quiet, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/quiet-1.2.0-26.3.jar",
    # As on fpv and plots, and the hub's walk-in portals ([config."config/tweaks.properties"] below).
    # Our mods/tweaks, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/tweaks-1.18.0-26.3.jar",
    # /backpack (for now only admins); see plots.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/backpack-1.0.0-26.3.jar",
    # /vanish, switched on by mods/vanish on the proxy (/v); see docs/admin.md#vanish.
    "https://cdn.modrinth.com/data/UL4bJFDY/versions/KgeCcJWw/vanish-1.6.16%2B26.3.jar",
    # /view inv|echest <player> for staff, items can be moved; /invsee on the proxy opens it here.
    "https://cdn.modrinth.com/data/jrDKjZP7/versions/uySsk7v8/InvView-1.4.22-26.3%2B.jar",
    # Proximity voice chat (Simple Voice Chat), optional for players; voice goes through the proxy (docs/servers.md#voice-chat).
    "https://cdn.modrinth.com/data/9eGKb6K1/versions/x9jLR94Q/voicechat-fabric-2.6.27%2B26.3.jar",
    # In FPV the voice chat mod hears from the drone's camera; this keeps hearing by the body
    # ([config."config/voicebody.properties"] below). Our mods/voicebody, built and uploaded by hand.
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/voicebody-1.0.1-26.3.jar",
    # /link for the Discord bot: the link-only build of the bridge mod (branch hub-link of the bot's repo);
    # its key is BRIDGE_KEY_HUB (see docs/admin.md#discord-bot).
    "https://fsn1.your-objectstorage.com/propwash-worlds/mods/propwash-bridge-0.4.0-hub-26.3.jar",
]

# /help, in MiniMessage with palette.toml tags.
help = """
<brand><bold>Hub</bold></brand>: the lobby. Walk through a portal to join a server.
<accent>/spawn</accent>: back to the hub spawn
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<bold><white>Welcome to </white><propwash>Propwash FPV</propwash><white>!</white></bold>
"""

# Players arrive at the hub spawn every time (files/world/datapacks/hubspawn); /spawn goes there too
# (files/config/melius-commands/commands/spawn.json). Only the Essential Commands players get through
# permissions.toml; these are off here: the hub is just the lobby.
[config."config/EssentialCommands.properties"]
use_permissions_api = "true"
enable_spawn = "false"
enable_home = "false"
enable_tpa = "false"
enable_warp = "false"
enable_back = "false"
enable_rtp = "false"
enable_enderchest = "false"

# The portals to fpv and plots (mods/tweaks: a player inside the box goes to that server; the nether
# portal blocks in them only look the part). "<dimension> <x1> <y1> <z1> <x2> <y2> <z2> <server>".
[config."config/tweaks.properties"]
staffwatch-folder = "/home/mc/servers/velocity/plugins/staffwatch"
"portal.fpv" = "maps:mountains -124 -28 54 -121 -18 54 fpv"
"portal.plots" = "maps:mountains -103 -28 72 -103 -18 75 plots"

# Vanish (/v): no fake "left the game" / "joined the game" when vanishing, like every other join message.
[config."config/vanish.hocon"]
send-join-disconnect-message = "false"

# The maps' resource pack (Drift Arena furniture models), as on fpv; see docs/maps.md#drift-arena-and-moto-arena.
[properties]
# Escaped the way the server writes it back, so deploys don't see a change and restart.
# The regular maps pack, with the backpack cosmetic's model (propwash_cosmetics:backpack, mods/backpack).
# Halloween 2026 used propwash-maps-halloween-855e1980.zip instead (docs/maps.md#halloween).
resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/propwash-maps-06573e10.zip'
resource-pack-sha1 = "06573e10626030bf1dd1a0e46acacbcd0adad981"
require-resource-pack = "false"

# Only written when the server is first created.
[new_world]
motd = "Propwash Community Hub"
level-type = "minecraft\\:flat"
generator-settings = '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
generate-structures = "false"
difficulty = "peaceful"
gamemode = "adventure"
force-gamemode = "true"
spawn-protection = "0"

# Simple Voice Chat: its own UDP port, the server's port - 1000, only on 127.0.0.1 (it would take every address);
# players reach it through the proxy's voice port (docs/servers.md#voice-chat).
[config."config/voicechat/voicechat-server.properties"]
port = "24567"
bind_address = "127.0.0.1"
max_voice_distance = "150"

# mods/voicebody: enabled = "false" turns it off on this server (pilots in FPV then hear around their
# drone, as the voice chat mod does by itself). Read again when the file changes.
[config."config/voicebody.properties"]
enabled = "true"

# One WorldEdit command changes at most 1,000,000 blocks unless you raise it for yourself with
# //limit <blocks> (//limit -1: none, admins only); a huge //set loaded ~50,000 chunks and froze a
# server (docs/admin.md#frozen-server).
[config."config/worldedit/worldedit.properties"]
default-max-changed-blocks = "1000000"
