# /help, in MiniMessage with palette.toml tags. Essentials shows 9 lines per page, network part included.
help = """
<brand><bold>Hub</bold></brand>: the lobby. Walk through a portal to join a server.
"""

# Shown in chat every time a player arrives on the server, in MiniMessage with palette.toml tags.
welcome = """
<bold>Welcome to <brand>Propwash FPV!</brand></bold>
"""

# Players go to the hub spawn (set it in game with /setspawn) every time they arrive.
[config."plugins/Essentials/config.yml"]
spawn-on-join = "true"
delay-motd = "-1"
notify-no-new-mail = "false"
# Nested under newbies:, hence the indent. '' = no kit on first join (the default gives stone tools).
"  kit" = "''"
# No "joined the game" / "left the game" in chat ('' hides them; none would be vanilla's).
custom-join-message = "''"
custom-quit-message = "''"
# "You are now AFK" only to the player, not to everyone.
broadcast-afk-message = "false"
# Players /v made vanished (essentials.silentjoin.vanish, set by mods/vanish) arrive vanished.
allow-silent-join-quit = "true"

# The maps' resource pack (Drift Arena furniture models), as on fpv; see docs/maps.md#drift-arena-and-moto-arena.
[properties]
# Escaped the way the server writes it back, so deploys don't see a change and restart.
# Halloween 2026: the maps pack plus Halloween (witch's broom frames, spooky sounds), the same maps
# assets; docs/maps.md#halloween. After Halloween, back to the regular maps pack (still in the world store):
# resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/propwash-maps-6557a509.zip'
# resource-pack-sha1 = "6557a50938db41df0a9ce22c7df79e849ca4a16b"
resource-pack = 'https\://fsn1.your-objectstorage.com/propwash-worlds/fpv/resourcepacks/propwash-maps-halloween-855e1980.zip'
resource-pack-sha1 = "855e198010019577ff7a6dabd8fd93f3af86ee0f"
require-resource-pack = "false"

# Only written when the server is first created.
[new_world]
motd = "Propwash Community Hub"
level-type = "minecraft\\:flat"
generator-settings = '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
generate-structures = "false"
difficulty = "peaceful"
gamemode = "adventure"
force-gamemode = "true"
spawn-protection = "0"
