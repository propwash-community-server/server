plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java'
}

version = "${project.mod_version}+${project.minecraft_version}"
base.archivesName = 'blockaliases'

repositories {
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    // Minecraft 26.x ships with Mojang's names, so no mappings.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // The block parser API; the server has WorldEdit itself.
    compileOnly("com.sk89q.worldedit:worldedit-core:${project.worldedit_version}") { transitive = false }
    compileOnly("com.sk89q.worldedit.worldedit-libs:core:${project.worldedit_version}") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
