plugins {
    id 'java'
}

version = project.plugin_version
base.archivesName = 'staffwatch'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
    // Writes velocity-plugin.json from the @Plugin annotation.
    annotationProcessor "com.velocitypowered:velocity-api:${project.velocity_version}"
    // Who is watched: their LuckPerms groups and permissions.
    compileOnly 'net.luckperms:api:5.4'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
