plugins {
    id 'java'
}

version = project.plugin_version
base.archivesName = 'vanish'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${project.velocity_version}"
    compileOnly 'net.luckperms:api:5.4'
    // The newest TAB API on JitPack; VanishIntegration is the same in the 6.2.0 we run.
    compileOnly('com.github.NEZNAMY:TAB-API:6.1.2') { transitive = false }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}
