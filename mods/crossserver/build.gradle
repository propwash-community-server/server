plugins {
    id 'java'
}

version = project.plugin_version
base.archivesName = 'crossserver'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
    // Writes velocity-plugin.json from the @Plugin annotation.
    annotationProcessor "com.velocitypowered:velocity-api:${project.velocity_version}"
    // [AFK] in the tab list (Afk): the newest TAB API on JitPack, the same placeholder API as the 6.2.0 we run.
    compileOnly('com.github.NEZNAMY:TAB-API:6.1.2') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
