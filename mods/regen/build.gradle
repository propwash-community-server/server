plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java'
}

version = "${project.mod_version}+${project.minecraft_version}"
base.archivesName = 'regen'

// Propwash and Flan aren't in a Maven repository we use: the jars the servers run, downloaded once.
def depJar(String task, String url) {
    def jar = layout.buildDirectory.file("deps/" + url.tokenize('/').last())
    tasks.register(task) {
        outputs.file(jar)
        doLast {
            def f = jar.get().asFile
            if (!f.exists()) {
                f.parentFile.mkdirs()
                new URI(url).toURL().withInputStream { input -> f.withOutputStream { it << input } }
            }
        }
    }
    tasks.named('compileJava') { dependsOn task }
    return jar
}
def propwashJar = depJar('propwashJar', project.propwash_url)
def flanJar = depJar('flanJar', project.flan_url)

dependencies {
    // Minecraft 26.x ships with Mojang's names, so no mappings.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files(propwashJar)
    compileOnly files(flanJar)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
